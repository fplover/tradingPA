<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>visual-regression harness</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #131722;
      }
      #grid {
        display: flex;
        width: 100vw;
        height: 100vh;
      }
      .cell {
        position: relative;
        flex: 1 1 0;
        min-width: 0;
        min-height: 0;
      }
      .cell canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="grid"></div>
    <script type="module" src="./visual-harness.ts"></script>
  </body>
</html>
